services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smartattend
      POSTGRES_USER: smartattend
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - smartattend_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartattend -d smartattend"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  smartattend_postgres:

